networks:
  bookstore_network:
    name: bookstore_network
    driver: bridge

services:
  # PostgreSQL Database
  pgdb:
    image: postgres:16-alpine
    container_name: pgdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstoredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      # Use named volume for database data (recommended for safety and performance)
      - ./postgres_data:/var/lib/postgresql/data
      # Bind mount for initialization scripts (easy to edit)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Optional: bind mount for easy database dumps during development
      # - ./docker/postgres/dumps:/dumps
    ports:
      - "5532:5432"
    networks:
      - bookstore_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookstoredb"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django Web Application
  djangoweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: djangoweb
    restart: unless-stopped
    ports:
      - "8110:8000"
    environment:
      # Django Settings
      SECRET_KEY: "django-insecure--7%o((3$-(jvf4lr1z=m(@v#d1rgr^mrrx-q%6(=8cq44_59rp"
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      STATIC_ROOT: /app/staticfiles
      
      # Database Configuration
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: bookstoredb
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_HOST: pgdb
      DB_PORT: 5432
    volumes:
      # Development volume mounts for live code changes
      - ./:/app
      # Preserve .venv directory in container
      - /app/.venv
    depends_on:
      pgdb:
        condition: service_healthy
    networks:
      - bookstore_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "